<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Antrean UPT. Puskesmas Mentikan</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-green: #10b981;
            --secondary-teal: #0d9488;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.05) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: var(--primary-green);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .main-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 2px solid transparent;
            color: var(--text-light);
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            border-color: var(--secondary-teal);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: var(--secondary-teal);
        }

        /* ===== GRID CENTER ===== */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 250px));
            justify-content: center;
            gap: 25px;
            margin-top: 40px;

            opacity: 0;
            filter: brightness(0.6) blur(4px);
            transition: opacity 0.4s ease, filter 0.4s ease;
            visibility: hidden;
            height: 0;
            overflow: hidden;
        }

        .menu-grid.active {
            opacity: 1;
            filter: brightness(1) blur(0);
            visibility: visible;
            height: auto;
        }

        .card-link {
            text-decoration: none;
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 20px;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.25s ease;
        }

        .card-link i {
            font-size: 3rem;
            color: var(--primary-green);
        }

        .card-link:hover {
    background: rgba(16, 185, 129, 0.12);
    border-color: var(--primary-green);
    box-shadow: 0 0 20px rgba(16,185,129,0.3);
}
        .card-link span {
            font-weight: 600;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 80px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>UPT. PUSKESMAS MENTIKAN</h1>
        <p>Sistem Manajemen Antrean Digital</p>
    </header>

    <div class="main-nav">
        <button class="nav-btn active" onclick="showMenu('petugas', this)">
            <i class="fas fa-user-md"></i> Panel Petugas
        </button>
        <button class="nav-btn" onclick="showMenu('pasien', this)">
            <i class="fas fa-tv"></i> Layar Antrean
        </button>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;">

    <div id="petugas" class="menu-grid active">

        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?view=antrean" class="card-link" target="_blank">
            <i class="fas fa-cash-register"></i>
            <span>Loket</span>
        </a>

        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?poli=Umum" class="card-link" target="_blank">
            <i class="fas fa-stethoscope"></i>
            <span>Poli Umum</span>
        </a>

        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?poli=Gigi" class="card-link" target="_blank">
            <i class="fas fa-tooth"></i>
            <span>Poli Gigi</span>
        </a>

        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?poli=KIA" class="card-link" target="_blank">
            <i class="fas fa-baby-carriage"></i>
            <span>Poli KIA</span>
        </a>

        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?poli=Farmasi" class="card-link" target="_blank">
            <i class="fas fa-pills"></i>
            <span>Farmasi</span>
        </a>

    </div>

    <div id="pasien" class="menu-grid">
         <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?view=pasien&poli=Umum" class="card-link" target="_blank">
            <i class="fas fa-desktop"></i>
            <span>Monitor Umum</span>
        </a>
        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?view=pasien&poli=Gigi" class="card-link" target="_blank">
            <i class="fas fa-desktop"></i>
            <span>Monitor Gigi</span>
        </a>
        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?view=pasien&poli=KIA" class="card-link" target="_blank">
            <i class="fas fa-desktop"></i>
            <span>Monitor KIA</span>
        </a>
        <a href="https://script.google.com/macros/s/AKfycbz0KI4vBqF31Jsz41gzhC7gpzfhaAsDN31mCekkz7RgNEYr9eBlhQoXTJiiXY7zbOYZiQ/exec?view=pasien&poli=Farmasi" class="card-link" target="_blank">
            <i class="fas fa-desktop"></i>
            <span>Monitor Farmasi</span>
        </a>
    </div>

    <footer>
        &copy; 2026 UPT. Puskesmas Mentikan - Responsive Dashboard
    </footer>
</div>

<script>
function showMenu(menuId, btn) {

    const allMenus = document.querySelectorAll('.menu-grid');
    const allButtons = document.querySelectorAll('.nav-btn');

    allMenus.forEach(menu => menu.classList.remove('active'));
    allButtons.forEach(button => button.classList.remove('active'));

    document.getElementById(menuId).classList.add('active');
    btn.classList.add('active');
}
</script>

</body>
</html>
